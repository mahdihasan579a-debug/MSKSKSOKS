<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KRAVEN HUB</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#030811;color:#fff;font-family:Arial,sans-serif}
.wrap{max-width:700px;margin:auto;padding:38px 18px 60px}h1{font-size:42px;margin:0 0 22px;font-weight:800}
.search{display:flex;gap:10px;margin-bottom:25px}input{flex:1;background:#121b2d;border:0;border-radius:30px;padding:17px 22px;color:white;font-size:17px;outline:none}
button{width:62px;border:0;border-radius:22px;background:#121b2d;color:#3183ff;font-size:27px}
.card{background:#101a2a;border-radius:24px;padding:20px;margin:17px 0;box-shadow:0 8px 25px #0008}
.row{display:flex;gap:18px}.icon{width:105px;height:105px;border-radius:5px;background:#263040;object-fit:cover;flex:none}
.title{font-size:25px;font-weight:800;margin:2px 0 8px}.desc{color:#8492ad;font-size:15px;font-weight:600;line-height:1.25}
.download{display:block;text-align:center;text-decoration:none;background:#3183ff;color:#fff;padding:16px;border-radius:25px;margin-top:18px;font-size:19px;font-weight:800}
.status{text-align:center;color:#8290aa;padding:25px;display:none}
@media(max-width:500px){h1{font-size:34px}.icon{width:90px;height:90px}.title{font-size:19px}.desc{font-size:12px}}

.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9999}.modal{width:min(380px,100%);background:#101a2a;border:1px solid #263852;border-radius:20px;padding:22px 18px;text-align:center;box-shadow:0 20px 60px #000b}.modal h2{margin:0 0 6px;font-size:20px;font-weight:800;line-height:1.15}.modal p{margin:0;color:#a9b5c9;font-size:15px;line-height:1.5;font-weight:600}.modal-close{margin-top:16px;width:100%;background:#3183ff;color:#fff;border:0;border-radius:18px;padding:14px;font-size:17px;font-weight:800;cursor:pointer}
</style>
</head>
<body>
<div id="welcomeDialog" class="modal-backdrop" role="dialog" aria-modal="true"><div class="modal"><h2>WELCOME TO KRAVEN HUB    </h2><p>PLEASE OPEN YOUR WIFI OR DATA TO DOWLOAD</p><button class="modal-close" id="closeDialog">Close</button></div></div>

<div class="wrap">
<h1 id="title">KRAVEN HUB</h1>
<div class="search"><input id="search" placeholder="Search apps..."><button>⌕</button></div>
<div id="list"></div><div id="status" class="status"></div><button id="retry" style="display:none;width:100%;background:#3183ff;color:#fff;border:0;border-radius:18px;padding:14px;font-size:17px;font-weight:800;cursor:pointer">Retry</button>
</div>
<script>
/*
  PALITAN LANG ANG CONFIG_URL:
  Format:
  https://raw.githubusercontent.com/USERNAME/REPOSITORY/refs/heads/main/config.json
*/
const CONFIG_URLS=[
  "https://raw.githubusercontent.com/mahdihasan579a-debug/MSKSKSOKS/refs/heads/main/config.json",
  "https://github.com/mahdihasan579a-debug/MSKSKSOKS/raw/refs/heads/main/config.json"
];
let apps=[];
const list=document.getElementById("list"),status=document.getElementById("status");
function esc(v){return String(v??"").replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[x]))}
function render(){
 const q=document.getElementById("search").value.toLowerCase();
 const items=apps.filter(a=>(a.title+" "+a.description).toLowerCase().includes(q));
 list.innerHTML=items.map(a=>`<div class="card"><div class="row">
 <img class="icon" src="${esc(a.icon)}" alt="">
 <div><div class="title">${esc(a.title)}</div><div class="desc">${esc(a.description)}</div></div>
 </div><a class="download" href="${esc(a.url)}" target="_blank" rel="noopener">Download</a></div>`).join("");
 status.style.display=items.length?"none":"block";if(!items.length)status.textContent="No apps found.";
}
async function fetchWithTimeout(url, ms=12000){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),ms);
  try{
    return await fetch(url,{cache:"no-store",signal:controller.signal});
  }finally{
    clearTimeout(timer);
  }
}

async function load(){
  status.style.display="block";
  status.textContent="Loading apps...";

  let lastError=null;
  for(const url of CONFIG_URLS){
    try{
      const r=await fetchWithTimeout(url);
      if(!r.ok) throw new Error("HTTP "+r.status);

      const data=await r.json();
      if(!data || !Array.isArray(data.apps)){
        throw new Error("Invalid config.json");
      }

      apps=data.apps;
      document.title=data.siteTitle||"KRAVEN HUB";
      document.getElementById("title").textContent=data.siteTitle||"KRAVEN HUB";
      render();
      document.getElementById("retry").style.display="none";
      return;
    }catch(e){
      lastError=e;
    }
  }

  status.style.display="block";
  status.textContent="Hindi ma-load ang config.json. I-check ang internet o GitHub.";
  document.getElementById("retry").style.display="block";
  console.error("Config load failed:",lastError);
}
document.getElementById("search").addEventListener("input",render);
document.getElementById("retry").addEventListener("click",load);
document.getElementById("closeDialog").addEventListener("click",()=>{document.getElementById("welcomeDialog").style.display="none"});
load();
</script>
</body>
</html>
